<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · null bot</title>
<link rel="icon" type="image/png" href="avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        background: #050505;
        color: #fff;
        font-family: 'Inter', system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        cursor: none;
        position: relative;
    }
    a, button { cursor: none; }

    .cursor-dot {
        position: fixed; width: 6px; height: 6px;
        background: #fff; border-radius: 50%;
        pointer-events: none; z-index: 9999;
        transform: translate(-50%, -50%);
        mix-blend-mode: difference;
    }
    .cursor-ring {
        position: fixed; width: 34px; height: 34px;
        border: 1px solid rgba(255,255,255,0.4);
        border-radius: 50%;
        pointer-events: none; z-index: 9998;
        transform: translate(-50%, -50%);
        transition: width 0.2s, height 0.2s, border-color 0.2s;
    }
    .cursor-ring.hover { width: 56px; height: 56px; border-color: #fff; }

    /* ФОНОВАЯ 404 — АБСОЛЮТ, НЕ ВЛИЯЕТ НА ПОТОК */
    .bg-404 {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(400px, 70vw, 1100px);
        font-weight: 900;
        line-height: 0.85;
        letter-spacing: -0.05em;
        color: transparent;
        -webkit-text-stroke: 1px rgba(255,255,255,0.05);
        z-index: 0;
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
    }

    /* Сетка */
    #bg-canvas {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.4;
    }

    /* КОНТЕНТ — ЦЕНТРИРУЕТСЯ ЧЕРЕЗ ABSOLUTE */
    .content {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        text-align: center;
        padding: 40px;
        max-width: 720px;
        width: 100%;
    }

    .code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        letter-spacing: 6px;
        color: #666;
        margin-bottom: 24px;
        text-transform: uppercase;
        font-weight: 700;
    }

    h1 {
        font-size: clamp(80px, 12vw, 160px);
        font-weight: 900;
        letter-spacing: -0.05em;
        line-height: 0.9;
        margin-bottom: 24px;
    }
    h1 .outline {
        color: transparent;
        -webkit-text-stroke: 1.5px #fff;
    }

    p {
        font-size: 15px;
        color: #b8b8b8;
        line-height: 1.6;
        margin-bottom: 40px;
    }

    .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 28px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        text-decoration: none;
        border: 1px solid transparent;
        transition: all 0.2s;
    }
    .btn-primary { background: #fff; color: #000; }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 40px rgba(255,255,255,0.2);
    }
    .btn-outline {
        background: transparent;
        color: #fff;
        border-color: #333;
    }
    .btn-outline:hover {
        border-color: #fff;
        background: rgba(255,255,255,0.03);
    }

    @media (max-width: 900px) {
        body { cursor: auto; }
        a, button { cursor: pointer; }
        .cursor-dot, .cursor-ring { display: none; }
        .actions { flex-direction: column; }
        .content { padding: 20px; }
    }
</style>
</head>
<body>

<div class="cursor-dot" id="cursor-dot"></div>
<div class="cursor-ring" id="cursor-ring"></div>

<canvas id="bg-canvas"></canvas>
<div class="bg-404">404</div>

<div class="content">
    <div class="code">ERROR · NOT FOUND</div>
    <h1>
        СТРАНИЦА<br>
        <span class="outline">НЕ НАЙДЕНА</span>
    </h1>
    <p>
        Такой страницы не существует или она была перемещена.
        Проверь адрес или вернись на главную.
    </p>
    <div class="actions">
        <a href="/nxll/" class="btn btn-primary">На главную</a>
        <a href="https://discord.gg/nxll" class="btn btn-outline" target="_blank" rel="noopener">Discord-сервер</a>
    </div>
</div>

<script>
    // КУРСОР
    const dot = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    let mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', (e) => {
        mx = e.clientX; my = e.clientY;
        dot.style.left = mx + 'px';
        dot.style.top = my + 'px';
    });
    function animateRing() {
        rx += (mx - rx) * 0.18;
        ry += (my - ry) * 0.18;
        ring.style.left = rx + 'px';
        ring.style.top = ry + 'px';
        requestAnimationFrame(animateRing);
    }
    animateRing();
    document.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('mouseenter', () => ring.classList.add('hover'));
        el.addEventListener('mouseleave', () => ring.classList.remove('hover'));
    });

    // СЕТКА
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, points = [];
    const SPACING = 100;
    function resizeCanvas() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        points = [];
        const cols = Math.ceil(W / SPACING) + 2;
        const rows = Math.ceil(H / SPACING) + 2;
        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                points.push({ bx: i * SPACING - SPACING, by: j * SPACING - SPACING });
            }
        }
    }
    let time = 0;
    function drawGrid() {
        ctx.clearRect(0, 0, W, H);
        const cols = Math.ceil(W / SPACING) + 2;
        const rows = Math.ceil(H / SPACING) + 2;
        const t = time * 0.001;
        const grid = [];
        for (let i = 0; i < cols; i++) {
            grid[i] = [];
            for (let j = 0; j < rows; j++) {
                const p = points[i * rows + j];
                if (!p) continue;
                const wave = Math.sin(i * 0.3 + j * 0.3 + t) * 10;
                grid[i][j] = { x: p.bx, y: p.by + wave };
            }
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 1;
        for (let j = 0; j < rows; j++) {
            ctx.beginPath();
            for (let i = 0; i < cols; i++) {
                const p = grid[i][j];
                if (!p) continue;
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
        }
        for (let i = 0; i < cols; i++) {
            ctx.beginPath();
            for (let j = 0; j < rows; j++) {
                const p = grid[i][j];
                if (!p) continue;
                if (j === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
        }
        time++;
        requestAnimationFrame(drawGrid);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    drawGrid();
</script>

</body>
</html>
